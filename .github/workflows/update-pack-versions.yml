name: Update pack versions

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: meza-ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          # Add active maintenance branches here, one per line.
          # - v1.x
    name: Update pack versions (${{ matrix.branch }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Update pack formats
        uses: meza/action-minecraft-pack-versions@6718a39243a5c34a166e46c84e8738617a77636f # v1.0.25
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          output_path: src/main/resources/pack_versions.json
          pr_branch: 'bot/pack-format/${{ matrix.branch }}'
          pr_base: ${{ matrix.branch }}
          commit_enabled: true
          commit_type: fix
          commit_scope: pack-format
          auto_merge: true
